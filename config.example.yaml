# Copy to config.yaml and edit. Restart the server (or POST /api/reload) after changes.
#
# Your accounts, channels, podcasts and calendars are added from the app itself:
# open the dashboard and click "⚙ Settings". They are saved in data/settings.json.
# This file decides which cards exist, their order, size and options.
#
# Every widget has:
#   id               unique name (used in the URL /api/widgets/<id>)
#   type             email | calendly | gcal | youtube | podcast | news | dolar | blog | feed | ibkr
#   title            card title
#   size             small | medium | large (2 columns) | full (whole row)
#   refresh_minutes  optional, overrides the widget's default
#   enabled          set to false to hide a widget without deleting it
# ...plus the options specific to its type (documented in README.md).
# Secrets can be written as ${VAR_NAME} with the value in .env.
# The order here is the order on screen.

title: Mi Dashboard
timezone: America/Argentina/Buenos_Aires

# Optional AI summaries (one line per email, news digest). Easiest: paste a free
# Gemini key in Settings. Or set it here: provider gemini (free tier) or anthropic.
ai:
  enabled: false
  provider: gemini
  api_key: ${GEMINI_API_KEY}
  language: Spanish

widgets:
  - id: email
    type: email
    title: Correo
    size: large
    max_messages: 8
    # Accounts are added in Settings.

  - id: calendly
    type: calendly
    title: Calendly hoy
    size: medium
    # Token is added in Settings.

  - id: gcal
    type: gcal
    title: Google Calendar hoy
    size: medium
    # Calendars are added in Settings.

  - id: dolar
    type: dolar
    title: Dólar hoy
    size: medium
    casas: [oficial, blue, bolsa, contadoconliqui, tarjeta, cripto]

  - id: youtube
    type: youtube
    title: YouTube
    size: large
    new_within_hours: 24
    limit: 12
    # Channels are added in Settings.

  - id: podcasts
    type: podcast
    title: Podcasts
    size: medium
    new_within_hours: 72      # an episode counts as NEW for 3 days
    # Podcasts are added in Settings.

  - id: news
    type: news
    title: Noticias
    size: full
    summarize: true
    sections:
      - heading: Argentina
        limit: 8
        feeds:
          - { name: La Nación, url: "https://www.lanacion.com.ar/arc/outboundfeeds/rss/?outputType=xml" }
          - { name: Infobae, url: "https://www.infobae.com/arc/outboundfeeds/rss/" }
          - { name: Clarín, url: "https://www.clarin.com/rss/lo-ultimo/" }
          - { name: Ámbito, url: "https://www.ambito.com/rss/pages/home.xml" }
      - heading: Internacional
        limit: 8
        feeds:
          - { name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
          - { name: The Guardian, url: "https://www.theguardian.com/world/rss" }
          - { name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml" }
          - { name: NYT World, url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml" }

  - id: portfolio
    type: ibkr
    title: Interactive Brokers
    size: medium
    enabled: false                  # set to true after adding the IBKR values to .env
    mode: flex                      # or client_portal
    flex_token: ${IBKR_FLEX_TOKEN}
    flex_query_id: ${IBKR_FLEX_QUERY_ID}
    net_deposits: ${IBKR_NET_DEPOSITS:-}   # optional: total deposited minus withdrawn
    top_positions: 8

  - id: blog
    type: blog
    title: Blogs
    size: medium
    new_within_hours: 72
    feeds:
      - { name: Paul Graham, url: "http://www.aaronsw.com/2002/feeds/pgessays.rss" }
      # The homepage works too if the site advertises its feed:
      # - { name: Some blog, url: "https://example.com" }
